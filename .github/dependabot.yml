# Weekly update PRs for pinned GitHub Actions (SHA pins) and container images.
# Python dependencies are upgraded deliberately with `make lock`, and CI's
# pip-audit job flags known vulnerabilities in the lock file on every push.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Major PostgreSQL and Redis upgrades are deliberate changes: a PostgreSQL
      # major version cannot start on an older data directory (pg_upgrade or dump
      # and restore), and the same versions are pinned in the CI test services and
      # the Helm chart's CI dependencies, which this ecosystem does not update.
      # Minor and patch releases still come through.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
